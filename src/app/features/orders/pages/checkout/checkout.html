<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Shipping Form -->
    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-6">
      <h2 class="text-3xl font-bold mb-6">Checkout</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <input
          type="text"
          placeholder="Full Name"
          [(ngModel)]="shipping.name"
          class="border p-3 rounded-lg outline-none"
        />

        <input
          type="email"
          placeholder="Email"
          [(ngModel)]="shipping.email"
          class="border p-3 rounded-lg outline-none"
        />

        <input
          type="text"
          placeholder="Phone"
          [(ngModel)]="shipping.phone"
          class="border p-3 rounded-lg outline-none"
        />

        <input
          type="text"
          placeholder="City"
          [(ngModel)]="shipping.city"
          class="border p-3 rounded-lg outline-none"
        />

        <input
          type="text"
          placeholder="State"
          [(ngModel)]="shipping.state"
          class="border p-3 rounded-lg outline-none"
        />

        <input
          type="text"
          placeholder="Pincode"
          [(ngModel)]="shipping.pincode"
          class="border p-3 rounded-lg outline-none"
        />
      </div>

      <textarea
        placeholder="Full Address"
        [(ngModel)]="shipping.address"
        rows="4"
        class="border p-3 rounded-lg outline-none w-full mt-5"
      ></textarea>
    </div>

    <!-- Order Summary -->
    <div class="bg-white rounded-2xl shadow p-6 h-fit">
      <h2 class="text-2xl font-bold mb-5">Order Summary</h2>

      <div *ngFor="let item of cartItems" class="flex items-center gap-4 mb-5 border-b pb-4">
        <img [src]="item.image" class="w-20 h-20 object-cover rounded-lg" />

        <div class="flex-1">
          <h3 class="font-semibold">{{ item.title }}</h3>

          <p class="text-gray-500">Quantity: {{ item.quantity }}</p>
        </div>

        <p class="font-bold">₹{{ item.price * item.quantity }}</p>
      </div>

      <div class="flex justify-between text-xl font-bold mt-6">
        <span>Total</span>
        <span>₹{{ getTotal() }}</span>
      </div>

      <button
        (click)="placeOrder()"
        class="w-full bg-black text-white py-3 rounded-xl mt-6 hover:bg-gray-800 transition"
      >
        Place Order
      </button>
    </div>
  </div>
</div>
