<div class="auth-container">
  <div class="auth-card">
    <div class="left">
      <h1>Welcome Back</h1>
      <p>Login to continue accessing your dashboard and manage your account.</p>
    </div>

    <div class="right">
      <form>
        <h2>Sign In</h2>

        <div class="input-box">
          <label>Email</label>
          <input type="email" placeholder="Enter your email" />
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" />
        </div>

        <button type="submit" class="login-btn">Login</button>

        <a routerLink="/register" class="register-btn"> Create New Account </a>
      </form>
    </div>
  </div>
</div>
