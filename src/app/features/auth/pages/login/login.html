<!-- login.html -->

<div class="auth-container">
  <div class="auth-card">
    <!-- LEFT SIDE -->
    <div class="left">
      <div class="overlay"></div>

      <div class="content">
        <span class="tag"> Luxury Access </span>

        <h1>
          Welcome <br />
          Back
        </h1>

        <p>Login to continue accessing your dashboard, orders, wishlist and premium collections.</p>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
      <form>
        <h2>Sign In</h2>

        <p class="sub-text">Please login to continue</p>

        <!-- EMAIL -->
        <div class="input-box">
          <label>Email Address</label>

          <input type="email" placeholder="Enter your email" />
        </div>

        <!-- PASSWORD -->
        <div class="input-box">
          <label>Password</label>

          <input type="password" placeholder="Enter your password" />
        </div>

        <!-- OPTIONS -->
        <div class="options">
          <label class="remember">
            <input type="checkbox" />

            Remember me
          </label>

          <a href="#"> Forgot Password? </a>
        </div>

        <!-- LOGIN -->
        <button type="submit" class="login-btn">Login</button>

        <!-- REGISTER -->
        <a routerLink="/register" class="register-btn"> Create New Account </a>
      </form>
    </div>
  </div>
</div>
